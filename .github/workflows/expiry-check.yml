name: Check credential expiry

on:
  schedule:
    - cron: '0 13 * * *'  # daily 13:00 UTC = 6 AM PT (PDT; 5 AM PST in winter)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: expiry-writer
  cancel-in-progress: false

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check credential registry & manage issues
        env:
          GH_TOKEN: ${{ github.token }}
          EXPIRY_REGISTRY: ${{ secrets.EXPIRY_REGISTRY }}
        run: python3 bin/check-expiry.py

      - name: Commit doorbell counts if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add admin/status.json
          if git diff --cached --quiet; then
            echo "No doorbell change."
          else
            git commit -m "chore(admin): refresh expiry doorbell counts"
            git pull --rebase origin main
            git push
          fi
